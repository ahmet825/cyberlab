<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Sayfa Bulunamadı // Siber Güvenlik Dersleri</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040711;
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #0b1329;
      border: 1px solid rgba(0, 255, 157, 0.3);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 255, 157, 0.15);
      border-radius: 12px;
      padding: 36px 28px;
      max-width: 540px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      color: #00ff9d;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00ff9d;
      color: #040711;
    }
    .btn-primary:hover {
      background: #38bdf8;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      border-color: #00ff9d;
      color: #00ff9d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 // HEDEF BULUNAMADI</div>
    <h1>404</h1>
    <p>
      Talep ettiğiniz rota sunucuda mevcut değil veya taşınmış olabilir. 
      Uygulamalı zafiyet laboratuvarlarına veya ana sayfaya dönerek devam edebilirsiniz.
    </p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">Ana Sayfaya Dön &rarr;</a>
      <a href="/labs/" class="btn btn-secondary">📚 Zafiyet Lab Kataloğu</a>
    </div>
  </div>
</body>
</html>
